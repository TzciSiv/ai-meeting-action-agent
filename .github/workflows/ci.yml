name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: meeting_agent
          POSTGRES_PASSWORD: meeting_agent
          POSTGRES_DB: meeting_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meeting_agent -d meeting_agent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://meeting_agent:meeting_agent@localhost:5432/meeting_agent_test
      DATABASE_URL: postgresql+psycopg://meeting_agent:meeting_agent@localhost:5432/meeting_agent_test
      OPENAI_API_KEY: test-key
      KAFKA_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: python -m evals.run --json
      - run: bandit -q -r backend
      - run: pip-audit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
