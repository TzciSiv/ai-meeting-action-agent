x-backend-worker-service: &backend-worker-service
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment:
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    OPENAI_TRANSCRIBE_MODEL: ${OPENAI_TRANSCRIBE_MODEL:-gpt-4o-mini-transcribe}
    OPENAI_SUMMARY_MODEL: ${OPENAI_SUMMARY_MODEL:-gpt-5-mini}
    OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
    OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-120}
    LANGCHAIN_PGVECTOR_COLLECTION: ${LANGCHAIN_PGVECTOR_COLLECTION:-meeting_transcript_chunks}
    APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
    PROMETHEUS_METRICS_ENABLED: ${PROMETHEUS_METRICS_ENABLED:-true}
    OTEL_TRACES_ENABLED: ${OTEL_TRACES_ENABLED:-true}
    OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-ai-meeting-action-agent-worker}
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    DATABASE_URL: postgresql+psycopg://meeting_agent:meeting_agent@postgres:5432/meeting_agent
    JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-change-me-but-use-env-in-real-apps}
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    KAFKA_ENABLED: ${KAFKA_ENABLED:-true}
    KAFKA_WORKER_GROUP_ID: ${KAFKA_WORKER_GROUP_ID:-meeting-agent-worker}
    WORKER_NAME: ${WORKER_NAME:-backend-worker}
    BACKEND_WORKER_REPLICAS: ${BACKEND_WORKER_REPLICAS:-3}
    WORKER_HEARTBEAT_INTERVAL_SECONDS: ${WORKER_HEARTBEAT_INTERVAL_SECONDS:-30}
    WORKER_HEARTBEAT_STALE_AFTER_SECONDS: ${WORKER_HEARTBEAT_STALE_AFTER_SECONDS:-90}
    WORKER_QUEUE_RECOVERY_SECONDS: ${WORKER_QUEUE_RECOVERY_SECONDS:-5}
    WORKER_QUEUE_RECOVERY_INTERVAL_SECONDS: ${WORKER_QUEUE_RECOVERY_INTERVAL_SECONDS:-2}
    WORKER_KAFKA_POLL_TIMEOUT_MS: ${WORKER_KAFKA_POLL_TIMEOUT_MS:-1000}
    WORKER_HEARTBEAT_RETAIN_COUNT: ${WORKER_HEARTBEAT_RETAIN_COUNT:-10}
  volumes:
    - ./backend:/app/backend
    - ./migrations:/app/migrations
    - ./alembic.ini:/app/alembic.ini:ro
    - ./evals:/app/evals
    - ./data:/app/data
  depends_on:
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy
  command: ["python", "-m", "backend.worker"]

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: meeting-agent-postgres
    environment:
      POSTGRES_USER: meeting_agent
      POSTGRES_PASSWORD: meeting_agent
      POSTGRES_DB: meeting_agent
    ports:
      - "5432:5432"
    volumes:
      - meeting_agent_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meeting_agent -d meeting_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    container_name: meeting-agent-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TRANSCRIBE_MODEL: ${OPENAI_TRANSCRIBE_MODEL:-gpt-4o-mini-transcribe}
      OPENAI_SUMMARY_MODEL: ${OPENAI_SUMMARY_MODEL:-gpt-5-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-120}
      LANGCHAIN_PGVECTOR_COLLECTION: ${LANGCHAIN_PGVECTOR_COLLECTION:-meeting_transcript_chunks}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      PROMETHEUS_METRICS_ENABLED: ${PROMETHEUS_METRICS_ENABLED:-true}
      OTEL_TRACES_ENABLED: ${OTEL_TRACES_ENABLED:-true}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-ai-meeting-action-agent}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      SLA_ANALYSIS_AVERAGE_SECONDS: ${SLA_ANALYSIS_AVERAGE_SECONDS:-30}
      SLA_ANALYSIS_MAX_SECONDS: ${SLA_ANALYSIS_MAX_SECONDS:-120}
      SLA_ERROR_RATE_OBJECTIVE: ${SLA_ERROR_RATE_OBJECTIVE:-below 5% in local/demo runs}
      DATABASE_URL: postgresql+psycopg://meeting_agent:meeting_agent@postgres:5432/meeting_agent
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-change-me-but-use-env-in-real-apps}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-10080}
      DEMO_USER_ROLE: ${DEMO_USER_ROLE:-admin}
      SYNC_DEMO_USER_ROLE: ${SYNC_DEMO_USER_ROLE:-true}
      BACKEND_WORKER_REPLICAS: ${BACKEND_WORKER_REPLICAS:-3}
      WORKER_HEARTBEAT_STALE_AFTER_SECONDS: ${WORKER_HEARTBEAT_STALE_AFTER_SECONDS:-90}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_ENABLED: ${KAFKA_ENABLED:-true}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini:ro
      - ./tests:/app/tests
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  backend-worker:
    <<: *backend-worker-service
    deploy:
      replicas: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
    depends_on:
      - backend

  backend-test:
    profiles:
      - test
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TRANSCRIBE_MODEL: ${OPENAI_TRANSCRIBE_MODEL:-gpt-4o-mini-transcribe}
      OPENAI_SUMMARY_MODEL: ${OPENAI_SUMMARY_MODEL:-gpt-5-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-120}
      LANGCHAIN_PGVECTOR_COLLECTION: ${LANGCHAIN_PGVECTOR_COLLECTION:-meeting_transcript_chunks}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      PROMETHEUS_METRICS_ENABLED: ${PROMETHEUS_METRICS_ENABLED:-true}
      OTEL_TRACES_ENABLED: ${OTEL_TRACES_ENABLED:-true}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-ai-meeting-action-agent}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      SLA_ANALYSIS_AVERAGE_SECONDS: ${SLA_ANALYSIS_AVERAGE_SECONDS:-30}
      SLA_ANALYSIS_MAX_SECONDS: ${SLA_ANALYSIS_MAX_SECONDS:-120}
      SLA_ERROR_RATE_OBJECTIVE: ${SLA_ERROR_RATE_OBJECTIVE:-below 5% in local/demo runs}
      DATABASE_URL: postgresql+psycopg://meeting_agent:meeting_agent@postgres:5432/meeting_agent_test
      TEST_DATABASE_URL: postgresql+psycopg://meeting_agent:meeting_agent@postgres:5432/meeting_agent_test
      TEST_POSTGRES_ADMIN_DATABASE: meeting_agent
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-change-me-but-use-env-in-real-apps}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-10080}
      DEMO_USER_ROLE: ${DEMO_USER_ROLE:-admin}
      SYNC_DEMO_USER_ROLE: ${SYNC_DEMO_USER_ROLE:-true}
      KAFKA_ENABLED: "false"
    volumes:
      - ./backend:/app/backend
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini:ro
      - ./tests:/app/tests
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "unittest", "discover", "-s", "tests"]

volumes:
  meeting_agent_postgres:
  frontend_node_modules:
